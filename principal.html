<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interview Jobs Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        #searchBox {
            float: right;
            margin: 10px;
            padding: 8px;
            font-size: 16px;
            width: 250px;
        }

        .question {
            color: red;
            font-weight: bold;
        }

        .answer {
            color: green;
        }

        button {
            margin: 10px 5px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="mb-3">
            <input type="text" id="accordionSearch" class="form-control" placeholder="Type to search..."
                oninput="liveSearchAccordion()" />
        </div>

        <h2 class="text-center mb-4">Interview Preparation Guide</h2>

        <div class="accordion" id="mainAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header" id="mainHeading1">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#mainCollapse1" aria-expanded="true" aria-controls="mainCollapse1">
                        Interview Topics & Sample Answers
                    </button>
                </h2>
                <div id="mainCollapse1" class="accordion-collapse collapse show" aria-labelledby="mainHeading1"
                    data-bs-parent="#mainAccordion">
                    <div class="accordion-body">
                        <div class="accordion" id="interviewAccordion">
                            <!-- JS Will Inject Questions Here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>


        const questions = [

            {
  question: "1. Tell us about your experience as a School Principal.",
  answer: `
  My name is Sarfraz, and I am from Dhanbad, Jharkhand.

  I started my career with St. John’s School as an English teacher for senior classes.
  My role was to ensure students understood concepts clearly, manage the classroom, and support weak students with extra attention.

  Within six months, I was promoted to Vice Principal.
  There, I handled responsibilities like managing teachers, preparing timetables, maintaining discipline, and supporting daily school operations.
  I also worked closely with the Director, who guided me in staff management and decision-making.

  After that, I joined Prakhar Secondary School, Giridih as a Principal in 2017.

  Since it was a new school, one major challenge was low student strength.
  To handle this, I focused on improving the school’s reputation by maintaining discipline, improving teaching quality, and building strong communication with parents.
  I personally interacted with parents, highlighted the school’s strengths, and ensured quality education, which gradually increased admissions.

  As a Principal, my responsibilities include managing overall academics, supervising teachers, conducting exams, maintaining discipline, and handling parent communication.

  I also focused strongly on creating an English-speaking environment in the school.
  I ensured that teachers communicate in English during school hours and encouraged students to do the same.
  This helped improve students’ confidence in spoken English and created a more professional academic environment.

  I also introduced monthly tests, extra classes for weak students, and regular performance tracking to improve student results.
  For teachers, I conducted classroom observations and provided regular feedback and training to improve teaching methods.

  Overall, my journey from teacher to Principal has given me both academic and administrative experience, and I am confident in handling school operations effectively.
  `
},
            {
                question: "2. How do you improve student academic performance?",
                answer: `
  I improve student performance through proper planning, monitoring, and support.

  For example, in my school, I introduced monthly performance tracking.
  Teachers submit reports, and we identify weak students early.

  Then we provide:
  • Extra classes
  • Doubt-clearing sessions
  • Parent meetings

  Because of this system, student results improved significantly in board exams.

  My approach is simple: Identify → Support → Improve.
  `
            },

            {
                question: "82. How do you handle weak students?",
                answer: `
  I believe every student can improve with the right guidance.

  First, I identify weak students through test results.
  Then I create a special plan like:
  • Extra classes
  • Personal attention from teachers
  • Regular follow-up

  For example, one student was very weak in English.
  We gave him daily reading practice and teacher support.
  Within 3 months, his performance improved a lot.

  So, my focus is not to ignore weak students but to support them.
  `
            },

            {
                question: "83. How do you manage teachers and improve their performance?",
                answer: `
  I manage teachers through regular monitoring, training, and motivation.

  I conduct:
  • Teacher meetings
  • Classroom observations
  • Training sessions

  For example, if a teacher is struggling with classroom management,
  I guide them with better teaching methods and give practical suggestions.

  I also appreciate good teachers, which boosts their confidence.

  This helps in improving overall teaching quality in the school.
  `
            },

            {
                question: "84. How do you handle discipline in school?",
                answer: `
  Discipline is very important for a good learning environment.

  I follow a balanced approach — strict but supportive.

  For example, if a student misbehaves:
  • First, I counsel the student
  • Then inform parents if needed
  • Take action only if behavior continues

  I also make clear school rules and ensure all students follow them.

  This helps maintain discipline without creating fear.
  `
            },

            {
                question: "85. How do you handle parents and build relationships?",
                answer: `
  I believe strong parent-school communication is very important.

  I organize:
  • Parent-Teacher Meetings (PTMs)
  • Regular updates about student progress

  For example, if a student is weak, I personally discuss with parents
  and suggest how they can support at home.

  Because of this, parents trust the school and stay involved in their child’s education.
  `
            },

            {
                question: "86. How do you ensure CBSE curriculum implementation?",
                answer: `
  I ensure CBSE curriculum is followed properly through planning and monitoring.

  I guide teachers to:
  • Follow CBSE syllabus
  • Use proper lesson plans
  • Conduct regular assessments

  For example, I check lesson plans weekly and ensure syllabus is completed on time.

  This ensures students are well-prepared for exams and meet CBSE standards.
  `
            },

            {
                question: "87. What is your leadership style as a Principal?",
                answer: `
  My leadership style is supportive and result-oriented.

  I believe in teamwork and clear communication.

  For example, I involve teachers in decision-making,
  which makes them feel valued and responsible.

  At the same time, I focus on results like student performance and discipline.

  So, I balance both — people management and performance.
  `
            },

            {
                question: "88. How do you handle school administration?",
                answer: `
  I handle school administration by proper planning and delegation.

  My responsibilities include:
  • Academic planning
  • Staff management
  • Timetable and exams
  • School operations

  For example, I divide responsibilities among staff
  and regularly monitor progress.

  This ensures smooth functioning of the school.
  `
            },

            {
                question: "89. Why should we hire you as a Principal?",
                answer: `
  You should hire me because I have strong experience in school leadership and proven results.

  I have:
  • Improved student performance
  • Managed teachers effectively
  • Maintained discipline and school growth

  For example, in my current school, I improved academic results
  through structured monitoring and teacher training.

  I am confident that I can bring the same improvement and growth to your school.
  `
            },

            {
                question: "90. What is your expected salary and joining time?",
                answer: `
  My expected salary is as per school norms and industry standards.

  I am open to discussion based on my experience and responsibilities.

  Also, I am an immediate joiner, so I can start as soon as required.
  `
            },

            {
  question: "91. What are your strengths and weaknesses as a Principal?",
  answer: `
My strengths are that I can lead the school well, keep discipline, and work nicely with my team of teachers.
If I see any problem in studies or teaching, I try to find a simple solution and fix it.

I also try to keep the school environment positive. I encourage teachers and students to speak in English, so everyone becomes more confident.

One weakness I had earlier was that I used to do too much work by myself.
But now I have learned to share work with my team and trust them, which makes the school work better and faster.
  `
},
{
  question: "92. What is the difference you observed between your previous and current school?",
  answer: `
  The main difference I observed is that St. John’s School was already an established school with proper systems in place,
  whereas Prakhar School was a new setup where I had to build systems from the beginning, improve admissions, and develop school culture.

  This experience helped me become more confident in handling challenges and setting up processes.`
},

{
  question: "93. What is your understanding of CBSE norms and regulations for running a school?",
  answer: `
  As per my experience, CBSE mainly focuses on quality education along with proper systems and compliance in the school.

  In my current role, I ensure that all teachers meet CBSE norms like having B.Ed. and proper subject specialization.
  I don’t assign subjects randomly—for example, an English teacher handles English, especially in senior classes, because it directly impacts board results.

  I also maintain a proper student-teacher ratio, usually around 30–35 students per class.
  If the strength increases, I plan for additional sections or teachers so that students get proper individual attention.

  If we don’t follow subject specialization or proper ratio, then teaching quality goes down, teachers get overloaded, discipline becomes difficult, and results are affected.
  These are also key points checked during CBSE inspections.

On the academic side, I focus on making sure students don’t just learn by heart, but actually understand things and can use them in real life.
So, I guide teachers to ask questions based on real-life situations, not just book questions. This is also important because now in board exams, around half of the paper is based on understanding and application.

I also follow some CBSE programs. For example, SQAA (School Quality Assessment and Assurance) means the school checks its own performance and keeps improving.
SAFAL (Structured Assessment for Analyzing Learning) helps us understand how well younger students are learning basic skills like reading and maths.
And NAS (National Achievement Survey) gives an overall idea of student performance at the national level.

So overall, I try to make sure learning is practical, simple, and improving continuously.
  On the infrastructure side, I ensure safety norms like fire safety, CCTV, sanitation, and proper facilities for students.

  I also make sure all mandatory records—like teacher documents, lesson plans, attendance, and academic records—are properly maintained,
  because CBSE is very strict about documentation and compliance.

  Overall, my approach is to keep the school always ready and aligned with CBSE expectations, not just during inspection time.
  `
},
{
  question: "94. What are the different school boards in India?",
  answer: `
  In India, there are different types of school boards.

  1. CBSE (Central Board of Secondary Education) – This is a national board. It helps students understand concepts and is good for exams like NEET and JEE.

  2. ICSE (Indian Certificate of Secondary Education) – This board is known for strong English and detailed study.

  3. State Board – This is run by each state. It is based on local language and is usually easier.
     Example: BSEB (Bihar School Examination Board), JAAC (Jharkhand Academic Council)

  4. IB (International Baccalaureate) – This is an international board. It focuses on practical learning and real-life thinking.

  5. IGCSE (International General Certificate of Secondary Education) – This is an international board by Cambridge. It gives flexible and global learning.

  6. NIOS (National Institute of Open Schooling) – This is for students who want to study from home or need flexible learning.
  `
},

{
  question: "95. Why did you leave St. John’s School?",
  answer: `
  I had a very good experience at St. John’s School. I started there as an English teacher and within six months, I was promoted to Vice Principal.

  I learned a lot, especially about school management and working under the guidance of the Director.

  After some time, I felt that I was ready to take on a bigger role with more responsibility.
  So, when I got the opportunity to work as a Principal at Prakhar Secondary School, I decided to move forward for my professional growth.
  `
},
{
  question: "96. Why do you want to leave your current school?",
  answer: `
  I have been working at Prakhar Secondary School since 2017, and it has been a very valuable experience for me.
  Since it was a new school, I got the opportunity to build systems, improve admissions, and manage overall school operations.

  Now, I feel that I have gained strong experience as a Principal, and I am looking for a new opportunity where I can work in a more established CBSE school.

  I want to take up new challenges, learn more, and contribute on a larger platform where I can use my experience for the overall growth of the school.
  `
}
        ]

        const accordion = document.getElementById("interviewAccordion");

        questions.forEach((item, index) => {
            accordion.insertAdjacentHTML("beforeend", `
        <div class="accordion-item">
          <h2 class="accordion-header" id="q${index + 1}">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
              data-bs-target="#a${index + 1}" aria-expanded="false" aria-controls="a${index + 1}" style="color:red">
              ${item.question}
            </button>
          </h2>
          <div id="a${index + 1}" class="accordion-collapse collapse" aria-labelledby="q${index + 1}"
            data-bs-parent="#interviewAccordion">
            <div class="accordion-body">${item.answer}</div>
          </div>
        </div>
      `);
        });

        function liveSearchAccordion() {
            const input = document.getElementById("accordionSearch").value.trim().toLowerCase();
            const items = document.querySelectorAll("#interviewAccordion .accordion-item");

            items.forEach(item => {
                const questionEl = item.querySelector(".accordion-button");
                const answerEl = item.querySelector(".accordion-body");

                const originalQuestion = questionEl.textContent;
                const originalAnswer = answerEl.textContent;

                const questionLower = originalQuestion.toLowerCase();
                const answerLower = originalAnswer.toLowerCase();

                const matchFound = questionLower.includes(input) || answerLower.includes(input);

                if (matchFound && input !== "") {
                    // Highlight in question
                    const highlightedQuestion = originalQuestion.replace(new RegExp(`(${input})`, "gi"), `<mark>$1</mark>`);
                    const highlightedAnswer = originalAnswer.replace(new RegExp(`(${input})`, "gi"), `<mark>$1</mark>`);

                    questionEl.innerHTML = highlightedQuestion;
                    answerEl.innerHTML = highlightedAnswer;
                } else {
                    // Remove highlighting by resetting textContent
                    questionEl.innerHTML = originalQuestion;
                    answerEl.innerHTML = originalAnswer;
                }

                item.style.display = matchFound || input === "" ? "" : "none";
            });
        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
