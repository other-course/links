<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Hub Dashboard</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.75rem;
            overflow: hidden;
        }

        header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1rem;
            color: var(--primary);
            font-weight: 700;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .home-btn:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        main {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: minmax(0, 1fr);
            gap: 0.5rem;
            padding: 0.5rem 0;
            min-height: 0;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            gap: 0.2rem;
            transition: all 0.2s ease;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgb(79 70 229 / 0.15), 0 4px 6px -4px rgb(79 70 229 / 0.15);
            z-index: 50;
        }

        .card-icon {
            font-size: 1.25rem;
        }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-desc {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: #1e293b;
            color: #ffffff;
            padding: 0.4rem 0.6rem;
            font-size: 0.7rem;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.2);
            z-index: 100;
            font-weight: 400;
        }

        .card-desc::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 4px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
        }

        .card:hover .card-desc {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        @media (min-width: 768px) {
            .card {
                align-items: flex-start;
                text-align: left;
                padding: 1rem;
            }
            .card-title {
                font-size: 0.85rem;
            }
        }

        footer {
            text-align: center;
            padding: 0.4rem;
            font-size: 0.65rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            flex-shrink: 0;
            box-shadow: var(--shadow);
        }
    </style>
</head>
<body>

    <header>
        <h1>Project Hub Dashboard</h1>
        <a href="../index.html" class="home-btn" id="homeNavigationLink">
            <span>&larr;</span> Home
        </a>
    </header>

    <main id="dashboard-grid">
        <!-- Dynamically populated section cards -->
    </main>

    <footer>
        &copy; 2026 Professional Workspace Hub &bull; Dynamic 100vh Layout
    </footer>

    <script>
        const sections = [
            { name: "Switch Mode", path: "swithMode.html", icon: "⚡", desc: "BPO Interview Assistance." },
            { name: "Deployment", path: "deployment.html", icon: "🚀", desc: "Tech Interview Assistance & AI tools." },
            { name: "Front-End Questions", path: "front-end-questions.html", icon: "❓", desc: "Front-End Questions." },
            { name: "Principal", path: "principal.html", icon: "👑", desc: "Principal Interview guidelines." },
            { name: "Promotion", path: "promotion.html", icon: "📈", desc: "Find Coding students via Marketing." },
            { name: "Codelab", path: "https://other-course.github.io/code-lab/", icon: "💻", desc: "All frontend design codes." },
            { name: "Course", path: "https://other-course.github.io/course/", icon: "📚", desc: "adca/mnc-job/tailwind/extra-income." },
            { name: "JS Learning", path: "https://github.com/other-course/js-learning", icon: "💛", desc: "JavaScript concepts and codes" }
        ];

        const grid = document.getElementById('dashboard-grid');
        grid.innerHTML = sections.map(item => `
            <a href="${item.path}" class="card">
                <div class="card-icon">${item.icon}</div>
                <div class="card-title">${item.name}</div>
                <div class="card-desc">${item.desc}</div>
            </a>
        `).join('');
    </script>
</body>
</html>
