                answer: `The Collection Pyramid is a model that shows how debt gets collected over time — from early stages (soft collections) to late stages (hard collections/legal action).

At the top of the pyramid, when the account is new (0–30 days past due), the calls are soft and friendly — just simple reminders.

As the account gets older (30–90 days past due), the tone becomes a little stronger. We may offer installment plans or settlements to help the customer pay.

If the account is still unpaid after 90–120+ days, it usually moves to third-party collections. At this stage, the approach is firmer, because recovery chances are lower.

At the very bottom of the pyramid, only a small percentage of accounts go into legal action or recovery stage.

                    <div class="accordion-body">${item.answer}</div>
                </div>
            </div>
        `);
            });

            // Re-apply live search filter if query exists
            liveSearchAccordion();
        }

        // 2. TOGGLE MODE FUNCTION
        function toggleMode() {
            const modeToggle = document.getElementById("modeToggle");
            isStressMode = modeToggle.checked;
            renderAccordion();
        }

        // Safe Text Highlighting
        // Helper function: Highlights matching word inside a border box
function highlightTextInNode(node, query) {
    if (!query) return;

    // Escape special regex characters
    const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
    const regex = new RegExp(`(${escapedQuery})`, "gi");

    function traverse(curr) {
        if (curr.nodeType === 3) { // Text Node
            if (curr.nodeValue.toLowerCase().includes(query)) {
                const span = document.createElement('span');

                // <mark> की जगह class="search-word-box" वाला <span> यूज़ करेंगे
                span.innerHTML = curr.nodeValue.replace(regex, '<span class="search-word-box">$1</span>');

                curr.parentNode.replaceChild(span, curr);
            }
        } else if (curr.nodeType === 1 && curr.nodeName !== 'SCRIPT' && !curr.classList.contains('search-word-box')) {
            Array.from(curr.childNodes).forEach(traverse);
        }
    }
    traverse(node);
}
        // 3. SEARCH LOGIC (FIXED)
        function liveSearchAccordion() {
            const searchInput = document.getElementById("accordionSearch");
            if (!searchInput) return;

            const input = searchInput.value.trim().toLowerCase();
            const items = document.querySelectorAll("#interviewAccordion .accordion-item");

            items.forEach((item) => {
                const questionEl = item.querySelector(".q-title");
                if (!questionEl) return;

                // Retrieve original question directly from element attribute (no index bugs!)
                const originalQuestion = decodeURIComponent(questionEl.getAttribute("data-original"));

                // Strip HTML tags safely for clean string comparison
                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = originalQuestion;
                const cleanQuestion = tempDiv.textContent.toLowerCase();

                const isMatch = cleanQuestion.includes(input);

                if (input === "") {
                    questionEl.innerHTML = originalQuestion;
                    item.style.display = "block";
                } else if (isMatch) {
                    questionEl.innerHTML = originalQuestion;
                    highlightTextInNode(questionEl, input);
                    item.style.display = "block";
                } else {
                    item.style.display = "none";
                }
            });
        }
    </script>
